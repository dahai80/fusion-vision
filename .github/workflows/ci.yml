name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.17.4
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Tests (unit + golden + perf)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with test extras
        run: pip install -e ".[test]"
      - name: Run full test suite
        # Hosted runners measure the 2400px perf gate at ~2.5-3s (PRD target
        # 2s is for a quiet Apple Silicon dev machine), so relax the budget
        # here via the env override instead of failing every run.
        env:
          FUSION_VISION_PERF_BUDGET_S: "3.5"
        run: python -m pytest tests/ -q

  repro:
    name: Determinism (repro check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with test extras
        run: pip install -e ".[test]"
      - name: Run determinism check (3 runs, headless)
        run: python tests/perf/repro_check.py 3
